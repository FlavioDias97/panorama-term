name: Test build
# Só no fork, para o dono testar: roda em push para test-build/*, sem release, sem updater.
on:
  push:
    branches:
      - 'test-build/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            sidecar-rs
          shared-key: tauri-test-${{ matrix.target }}
      - name: Build (versão com o número do run, sem updater)
        shell: bash
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")-${{ github.run_number }}"
          echo "Versão de teste: $VERSION"
          case "${{ matrix.platform }}" in
            windows-*) BUNDLES=nsis ;;
            linux-*) BUNDLES=appimage,deb ;;
          esac
          bun run tauri build --target ${{ matrix.target }} --bundles "$BUNDLES" --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":false},\"plugins\":{\"updater\":{\"endpoints\":[\"https://127.0.0.1:9/updater.json\"]}}}"
      - name: Collect bundles
        shell: bash
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir out
          case "${{ matrix.platform }}" in
            windows-*) cp "$BUNDLE"/nsis/*-setup.exe out/ ;;
            linux-*) cp "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/deb/*.deb out/ ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: panorama-test-${{ matrix.platform }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
